name: restrorent_partner_app
description: "Eatoggy Restaurant Partner App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sizer: ^3.1.3
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.3.2
  dio: ^5.9.2
  url_launcher: ^6.3.2
  in_app_update: ^4.2.5
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
